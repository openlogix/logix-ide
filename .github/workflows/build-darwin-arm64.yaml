# Builds the Logix IDE macOS (Apple Silicon) installer: a .dmg with Logix IDE.app.
# Called by build-pre-release.yaml, which passes BUILD-INFO.json as the
# 'build-info' artifact.

name: build-darwin-arm64

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check required platform
        uses: openlogix/.github/actions/check-platform@main
        with:
          os: darwin
          arch: arm64

      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main
        with:
          platform: darwin-arm64

      # Into a subdirectory, not to step on BUILD-INFO.json.
      - name: Checkout the commit to build
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.REPO_COMMIT }}
          path: _repo

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JS dependencies
        working-directory: _repo
        run: npm ci

      # For the end-to-end UI tests in scripts/test.sh.
      - name: Install the Playwright WebKit browser
        working-directory: _repo
        run: npx playwright install webkit

      # Don't publish a build that fails its own checks.
      - name: Run checks and tests
        working-directory: _repo
        run: scripts/test.sh

      # Builds the release app and wraps it in a .dmg (the bundle settings,
      # including the ad-hoc signature and the .dmg window layout, are in
      # src-tauri/tauri.conf.json). Tauri skips the Finder step that lays out
      # the .dmg window (icon size and positions, hiding .VolumeIcon.icns)
      # when CI is set; TAURI_BUNDLER_DMG_IGNORE_CI turns it back on.
      # Tauri, Cargo and npm need a semver version: the release date without
      # leading zeros (2026-05-07 is 2026.5.7), which macOS shows in Finder.
      # Logix IDE itself shows yyyy.mm.dd (LOGIX_IDE_BUILD_VERSION, below).
      # The Open Logix versioning rule.
      - name: Write the semver version
        working-directory: _repo
        run: |
          IFS=- read -r y m d <<< "$RELEASE_TAG"
          export SEMVER="$((10#$y)).$((10#$m)).$((10#$d))"
          perl -pi -e 's/^  "version": "0\.0\.0",/  "version": "$ENV{SEMVER}",/' package.json src-tauri/tauri.conf.json
          perl -0pi -e 's/(\n  "name": "logix",\n  "version": )"0\.0\.0"/$1"$ENV{SEMVER}"/; s/(\n    "": \{\n      "name": "logix",\n      "version": )"0\.0\.0"/$1"$ENV{SEMVER}"/' package-lock.json
          perl -0pi -e 's/^version = "0\.0\.0"/version = "$ENV{SEMVER}"/m' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "logix"\nversion = )"0\.0\.0"/$1"$ENV{SEMVER}"/' src-tauri/Cargo.lock
          git diff --stat
          test "$(git diff --numstat | wc -l)" -eq 5

      - name: Build Logix IDE.app and the .dmg
        working-directory: _repo
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          LOGIX_IDE_BUILD_VERSION: ${{ env.RELEASE_TAG }}
        run: npm run tauri -- build --bundles dmg

      - name: Collect the .dmg
        run: |
          find _repo/src-tauri/target/release/bundle -maxdepth 2
          dmgs=(_repo/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 || ! -f "${dmgs[0]}" ]]; then
            echo "Error: expected exactly one .dmg, found: ${dmgs[*]}"
            exit 1
          fi
          cp "${dmgs[0]}" "logix-darwin-arm64-${PACKAGE_TAG}.dmg"
          ls -al *.dmg

      # Checks what users get: the .dmg is sound, it has the app, the
      # Applications shortcut and the Finder layout (.DS_Store), and the app
      # has a valid (ad-hoc) signature
      # (an unsigned app is reported as "damaged" when downloaded). Tauri
      # deletes the separate Logix IDE.app after making the .dmg, so the app is
      # checked inside the mounted .dmg.
      - name: Verify the .dmg and the app signature
        run: |
          dmg="logix-darwin-arm64-${PACKAGE_TAG}.dmg"
          hdiutil verify "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          ls -al "$mnt"
          test -L "$mnt/Applications"
          test -f "$mnt/.DS_Store"
          app="$mnt/Logix IDE.app"
          IFS=- read -r y m d <<< "$RELEASE_TAG"
          semver="$((10#$y)).$((10#$m)).$((10#$d))"
          shown="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$shown" != "$semver" ]]; then
            echo "Error: expected bundle version $semver, got: $shown"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee codesign.txt
          grep -q "Signature=adhoc" codesign.txt

      - name: Export the .dmg as an artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: logix-darwin-arm64
          path: logix-darwin-arm64-${{ env.PACKAGE_TAG }}.dmg
