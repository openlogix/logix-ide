# Builds the documentation site (mkdocs.yml, docs/) and publishes it to
# GitHub Pages: https://www.openlogix.org/logix-ide/
#
# Runs on every push to main, daily (to catch breakage from GitHub or
# MkDocs changes even when nothing changes here), and manually. The work is
# the shared Open Logix workflow in openlogix/.github.

name: publish-docs

on:
  push:
    branches: [main]

  # Daily at UTC midnight, like the build.
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A running one isn't cancelled (stopping a Pages
# deployment midway can leave it stuck, GitHub advises against it), but
# runs waiting behind it are: only the newest waiting run goes next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    uses: openlogix/.github/.github/workflows/publish-docs.yaml@main
