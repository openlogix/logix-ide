# Builds the user documentation (mkdocs.yml, docs/) and publishes it to
# GitHub Pages: https://zapta.github.io/logic-ide/
#
# Runs on every push to main, daily (to catch breakage from GitHub or
# MkDocs changes even when nothing changes here), and manually.

name: publish-docs

on:
  push:
    branches: [main]

  # Daily at UTC midnight, like the build.
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A running one isn't cancelled (stopping a Pages
# deployment midway can leave it stuck, GitHub advises against it), but
# runs waiting behind it are: only the newest waiting run goes next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the docs tools
        run: pip install -r docs/requirements.txt

      # --strict fails on broken links and other warnings.
      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
