# Builds the Logix IDE Linux (x64) package: a .deb (Milestone 4; only the
# .deb for now, the user's decision, 2026-11-16). Called by build-pre-release.yaml, which passes
# BUILD-INFO.json as the 'build-info' artifact. While Linux is being ported
# they're kept as the run's artifacts, not added to the release, and the
# pre-release doesn't wait for them (a stated, temporary step: the website
# repo's CLAUDE.md, Strict CI).

name: build-linux-x86-64

on:
  workflow_call:

jobs:
  build:
    # The oldest Ubuntu GitHub offers: a program built against an older
    # glibc runs on more Linux distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check required platform
        uses: openlogix/.github/actions/check-platform@main
        with:
          os: linux
          arch: x86_64

      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main
        with:
          platform: linux-x86-64

      # What Tauri needs to build on Linux (its WebKitGTK web view and GTK).
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      # Into a subdirectory, not to step on BUILD-INFO.json.
      - name: Checkout the commit to build
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.REPO_COMMIT }}
          path: _repo

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JS dependencies
        working-directory: _repo
        run: npm ci

      # For the end-to-end UI tests in scripts/test.sh.
      - name: Install the Playwright WebKit browser
        working-directory: _repo
        run: npx playwright install --with-deps webkit

      - name: Run checks and tests
        working-directory: _repo
        run: scripts/test.sh

      # Tauri, Cargo and npm need a semver version: the release date without
      # leading zeros (2026-05-07 is 2026.5.7). Windows Installer needs its
      # own, with a major and a minor of at most 255: the date as yy.mm.dd
      # (2026-05-07 is 26.5.7), which Windows shows in its list of apps.
      # Logix IDE itself shows yyyy.mm.dd (LOGIX_IDE_BUILD_VERSION, below).
      # The Open Logix versioning rule.
      # Tauri, Cargo and npm need a semver version: the release date without
      # leading zeros (2026-05-07 is 2026.5.7), never shown (the Open Logix
      # versioning rule). Logix IDE itself shows yyyy.mm.dd
      # (LOGIX_IDE_BUILD_VERSION, below).
      - name: Write the semver version
        working-directory: _repo
        run: |
          IFS=- read -r y m d <<< "$RELEASE_TAG"
          export SEMVER="$((10#$y)).$((10#$m)).$((10#$d))"
          perl -pi -e 's/^  "version": "0\.0\.0",/  "version": "$ENV{SEMVER}",/' package.json src-tauri/tauri.conf.json
          perl -0pi -e 's/(\n  "name": "logix-ide",\n  "version": )"0\.0\.0"/$1"$ENV{SEMVER}"/; s/(\n    "": \{\n      "name": "logix-ide",\n      "version": )"0\.0\.0"/$1"$ENV{SEMVER}"/' package-lock.json
          perl -0pi -e 's/^version = "0\.0\.0"/version = "$ENV{SEMVER}"/m' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "logix-ide"\nversion = )"0\.0\.0"/$1"$ENV{SEMVER}"/' src-tauri/Cargo.lock
          git diff --stat
          test "$(git diff --numstat | wc -l)" -eq 5

      - name: Build Logix IDE and the .deb
        working-directory: _repo
        env:
          LOGIX_IDE_BUILD_VERSION: ${{ env.RELEASE_TAG }}
        run: npm run tauri -- build --bundles deb

      - name: Collect the .deb
        run: |
          find _repo/src-tauri/target/release/bundle -maxdepth 2
          debs=(_repo/src-tauri/target/release/bundle/deb/*.deb)
          if [[ ${#debs[@]} -ne 1 || ! -f "${debs[0]}" ]]; then
            echo "Error: expected exactly one .deb, found: ${debs[*]}"
            exit 1
          fi
          cp "${debs[0]}" "logix-ide-linux-x86-64-${PACKAGE_TAG}.deb"
          ls -al *.deb

      # Checks what users get: the .deb holds the logix-ide program.
      - name: Verify the .deb
        run: |
          dpkg-deb --info "logix-ide-linux-x86-64-${PACKAGE_TAG}.deb"
          # Into a file: grep -q stops reading at its match, which fails
          # the pipe under pipefail.
          dpkg-deb --contents "logix-ide-linux-x86-64-${PACKAGE_TAG}.deb" > contents.txt
          cat contents.txt
          grep -Eq " (\./)?usr/bin/logix-ide$" contents.txt

      # Every package a CI build makes is scanned (the website repo's
      # CLAUDE.md, Shared CI), this one too while it's kept out of the
      # release.
      - name: Scan the .deb for viruses
        uses: openlogix/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: |
            logix-ide-linux-x86-64-*.deb

      - name: Export the .deb as an artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: linux-x86-64-packages
          path: logix-ide-linux-x86-64-${{ env.PACKAGE_TAG }}.deb
