# Builds the Logix IDE installers and publishes them as a GitHub pre-release
# tagged with the date (yyyy-mm-dd). A pre-release with the same tag is
# replaced, so the day's pre-release is from its latest commit; a stable
# release with that tag is never touched (the run fails instead). Old
# pre-releases are deleted by the shared policy.
#
# Runs on every push to main, daily, and manually. A newer run cancels a
# running one: only the latest commit's build matters.
#
# The shared parts are Open Logix actions in openlogix/.github (tested
# there): start-pre-release, read-build-info and publish-pre-release, which
# also writes the standard release text and applies the pre-release policy.
# Only macOS (Apple Silicon) for now; Linux and Windows will be added as
# separate build-<platform>.yaml workflows.

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, to minimize the risk of overstepping manual
  # builds of the same date.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  # Allow release creation.
  contents: write

# One build at a time; a newer one cancels the running one. If that happens
# while publishing, the newer run publishes the same date's pre-release
# again when it's done.
concurrency:
  group: build-pre-release
  cancel-in-progress: true

jobs:
  # ----- Collect the build parameters.

  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Start the pre-release
        uses: openlogix/.github/actions/start-pre-release@main
        with:
          package-name: logix-ide
          description: The Arduino experience, for FPGAs.

  # ----- Per-platform builds, each on its own runner.

  build-darwin-arm64:
    needs: prepare
    uses: ./.github/workflows/build-darwin-arm64.yaml
    secrets: inherit

  # ----- Create the pre-release with the generated files.

  pre-release:
    needs: [prepare, build-darwin-arm64]

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: logix-*
          merge-multiple: true
          path: _artifacts

      - name: Scan the installers for viruses
        uses: openlogix/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: |
            _artifacts/logix-*.dmg

      # The release text's own part; publish-pre-release adds the rest.
      - name: Write the release content
        run: |
          url="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          cat > CONTENT.md <<EOF
          ### Installing Logix IDE on macOS (Apple Silicon)

          1. Download \`logix-darwin-arm64-${PACKAGE_TAG}.dmg\` (below) to your **Downloads** folder.
          2. Open **Terminal** and run this command. Logix IDE isn't signed with an Apple Developer ID yet, and this tells macOS to allow it:
             \`\`\`
             xattr -c ~/Downloads/logix-darwin-arm64-${PACKAGE_TAG}.dmg
             \`\`\`
          3. Double-click the \`.dmg\` file and drag **Logix IDE** into the **Applications** folder.
          4. Open Logix IDE from Applications. On its first start, Logix IDE downloads the FPGA tools it needs. This may take a few minutes; later starts are quick.

          To uninstall, drag Logix IDE from Applications to the Trash. You can also delete the \`~/.logix/ide\` folder, which holds the FPGA tools Logix IDE downloaded and its settings. Your projects aren't in it.

          ### Logix IDE installers

          | System | Architecture | Installer type | Package |
          | :--- | :--- | :--- | :--- |
          | macOS | Apple Silicon | Disk image | [logix-darwin-arm64-${PACKAGE_TAG}.dmg](${url}/logix-darwin-arm64-${PACKAGE_TAG}.dmg) |
          EOF
          cat -n CONTENT.md

      - name: Publish the pre-release
        uses: openlogix/.github/actions/publish-pre-release@main
        with:
          title: "Logix IDE: The Arduino experience, for FPGAs."
          links: "[Main page](https://www.openlogix.org/ide/) · [Docs](https://www.openlogix.org/logix-ide/) · [Install guide](https://www.openlogix.org/logix-ide/installing/)"
          content-file: CONTENT.md
          files: |
            _artifacts/logix-darwin-arm64-${{ env.PACKAGE_TAG }}.dmg
