# Builds the Logix installers and publishes them as a GitHub pre-release
# tagged with the date (yyyy-mm-dd). A pre-release with the same tag is
# replaced, so the day's pre-release is from its latest commit; a stable
# release with that tag is never touched (the run fails instead). Only the
# newest pre-releases are kept (about 5).
#
# Runs on every push to main, daily, and manually. A newer run cancels a running one: only the latest commit's
# build matters.
#
# The steps use this repo's actions in .github/actions (tested by
# test-actions.yaml). Only macOS (Apple Silicon) for now; Linux and Windows
# will be added as separate build-<platform>.yaml workflows.

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, to minimize the risk of overstepping manual
  # builds of the same date.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  # Allow release creation.
  contents: write

# One build at a time; a newer one cancels the running one. If that happens
# while publishing, the newer run publishes the same date's pre-release
# again when it's done.
concurrency:
  group: build-pre-release
  cancel-in-progress: true

env:
  # These are set later.
  RELEASE_TAG: ""
  PACKAGE_TAG: ""
  REPO: ""
  REPO_BRANCH: ""
  REPO_COMMIT: ""
  LOGIX_VERSION: ""

jobs:
  # ----- Collect the build parameters.

  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get release and package tags
        uses: ./.github/actions/get-release-and-package-tags
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG

      - name: Early check for no conflicting release
        uses: ./.github/actions/ensure-no-conflicting-release
        with:
          release-tag: ${{ env.RELEASE_TAG }}
          just-check: true

      # The repo name is normalized to lowercase, e.g. openlogix/logix-ide.
      - name: Get repo info
        uses: ./.github/actions/get-repo-info
        with:
          repo-dir: .
          repo-var: REPO
          branch-var: REPO_BRANCH
          commit-var: REPO_COMMIT

      - name: Get Logix version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "LOGIX_VERSION=$version"
          echo "LOGIX_VERSION=$version" >> "$GITHUB_ENV"

      # The build configuration passed to the other jobs.
      - name: Create build info
        run: |
          cat > BUILD-INFO.json <<EOF
          {
            "package-name": "logix",
            "description": "\"The Arduino experience, for FPGAs\"",
            "logix-version": "$LOGIX_VERSION",
            "repo": "${REPO}",
            "repo-branch": "${REPO_BRANCH}",
            "repo-commit": "${REPO_COMMIT}",
            "release-tag": "$RELEASE_TAG",
            "package-tag": "$PACKAGE_TAG",
            "build-time": "$(date +'%Y-%m-%d %H:%M:%S %Z')",
            "builder-workflow": "${{ github.workflow }}",
            "workflow-run-id": "${{ github.run_id }}",
            "workflow-run-number": "${{ github.run_number }}"
          }
          EOF
          cat -n BUILD-INFO.json

      - name: Format build info json file in-place
        uses: ./.github/actions/format-json-file
        with:
          json-file: BUILD-INFO.json

      - name: Upload the build info artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: build-info
          path: BUILD-INFO.json

  # ----- Per-platform builds, each on its own runner.

  build-darwin-arm64:
    needs: prepare
    uses: ./.github/workflows/build-darwin-arm64.yaml
    secrets: inherit

  # ----- Create the pre-release with the generated files.

  pre-release:
    needs: [prepare, build-darwin-arm64]

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: _artifacts

      - name: Scan the packages for viruses
        uses: ./.github/actions/scan-files-for-viruses
        with:
          file-patterns: |
            _artifacts/logix-*.dmg

      - name: Move build info
        run: |
          find _artifacts
          mv _artifacts/BUILD-INFO.json .
          cat -n BUILD-INFO.json

      - name: Set env vars from JSON
        uses: ./.github/actions/set-env-from-json
        with:
          json-file: BUILD-INFO.json
          mappings: >-
            LOGIX_VERSION  logix-version
            REPO           repo
            REPO_COMMIT    repo-commit
            RELEASE_TAG    release-tag
            PACKAGE_TAG    package-tag

      - name: Convert json build info to text
        uses: ./.github/actions/json-to-text
        with:
          input-json: BUILD-INFO.json
          output-text: build-info.txt

      - name: Create assets markdown table
        run: |
          # The common prefix of the assets urls.
          URL_PREFIX="https://github.com/${REPO}/releases/download/$RELEASE_TAG"
          echo "URL_PREFIX=${URL_PREFIX}"

          cat << EOF > "assets-table.md"

          ### Logix installers

          | System | Architecture | Installer type | Package |
          | :--- | :--- | :--- | :--- |
          | macOS | Apple Silicon | Disk image | [logix-darwin-arm64-${PACKAGE_TAG}.dmg](${URL_PREFIX}/logix-darwin-arm64-${PACKAGE_TAG}.dmg) |
          EOF

          cat -n "assets-table.md"

      # Summary for the workflow run page.
      - name: Prepare workflow run summary
        run: |
          cat > RUN-SUMMARY.txt <<EOF

          Build info:
          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          - [Logix cutoff commit](https://github.com/${REPO}/commit/${REPO_COMMIT})

          - [Generated Logix pre-release](https://github.com/${REPO}/releases/tag/${RELEASE_TAG})
          EOF

          cat -n RUN-SUMMARY.txt

      - name: Post workflow run summary
        run: |
          cat RUN-SUMMARY.txt >> $GITHUB_STEP_SUMMARY

      # Notes for the release page.
      - name: Prepare release text
        run: |
          cat > RELEASE-BODY.txt <<EOF

          **Logix: "The Arduino experience, for FPGAs."**

          ### Installing Logix on macOS (Apple Silicon)

          1. Download \`logix-darwin-arm64-${PACKAGE_TAG}.dmg\` (below) to your
             **Downloads** folder.
          2. Open **Terminal** and run this command. Logix isn't signed with an
             Apple Developer ID yet, and this tells macOS to allow it:
             \`\`\`
             xattr -c ~/Downloads/logix-darwin-arm64-${PACKAGE_TAG}.dmg
             \`\`\`
          3. Double-click the \`.dmg\` file and drag **Logix** into the
             **Applications** folder.
          4. Open Logix from Applications. On its first start, Logix downloads
             the FPGA tools it needs. This may take several minutes; later
             starts are quick.

          To uninstall, drag Logix from Applications to the Trash. You can
          also delete the \`~/.logix\` folder, which holds the FPGA tools
          Logix downloaded and its settings. Your projects aren't in it.

          $(cat assets-table.md)

          ### Build info

          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          ### About these releases

          - Releases are created daily with a \`pre-release\` status, and only
            the newest ones (about 5) are kept, unless set to be \`stable\`.
          - To make a pre-release stable, edit it manually and change its
            status from \`Pre-release\` to \`None\`.
          EOF

          cat -n RELEASE-BODY.txt

      - name: Cleanup old pre-releases
        uses: ./.github/actions/cleanup-old-prereleases

      # Deletes an existing pre-release with today's tag, so it's replaced.
      - name: Ensure no conflicting release (again)
        uses: ./.github/actions/ensure-no-conflicting-release
        with:
          release-tag: ${{ env.RELEASE_TAG }}

      - name: Create GitHub pre-release
        uses: ./.github/actions/create-pre-release
        with:
          release_tag: ${{ env.RELEASE_TAG }}
          body_path: RELEASE-BODY.txt
          # The expected files are listed explicitly rather than with
          # patterns, so a missing one fails the run.
          files: |
            _artifacts/logix-darwin-arm64-${{ env.PACKAGE_TAG }}.dmg
            BUILD-INFO.json
