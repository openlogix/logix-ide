# Runs all code checks and tests (scripts/test.sh).

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at the start of the UTC day, to catch breakage from new
    # dependency or tool versions even when the code doesn't change.
    - cron: "0 0 * * *"

permissions:
  contents: read

# A newer run for the same branch or PR replaces an older one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The remote config (remote-config/logix-ide/<NNN>/: channels.jsonc and a
  # config file per channel): the shared check (schemas, channels, releases
  # and files exist, SHA256SUMS lists them, prod.jsonc names only stable
  # releases, only openlogix repos on main).
  remote-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check the remote config
        uses: openlogix/.github/actions/check-remote-config@main
        with:
          platforms: darwin-arm64

  test:
    name: test (${{ matrix.os }})
    # macOS on Apple Silicon: the only platform implemented so far, on the
    # macOS versions GitHub offers (all arm64; macos-14 is retired on
    # 2026-11-02). macos-latest is macos-26 for now; it's listed so a new
    # macOS release gets tested as soon as GitHub switches to it. Add linux
    # and windows here when those platforms are implemented.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JS dependencies
        run: npm ci

      # For the end-to-end UI tests in scripts/test.sh.
      - name: Install the Playwright WebKit browser
        run: npx playwright install webkit

      # Once per config file in the newest version folder (the website
      # repo's CLAUDE.md, Remote updates, Channels): prod.jsonc alone in
      # normal maintenance, dev.jsonc too while it exists.
      - name: Run checks and tests, per config file
        run: |
          set -euo pipefail
          folder="$(ls -d remote-config/logix-ide/[0-9][0-9][0-9] | sort | tail -1)"
          for f in "$folder"/*.jsonc; do
            channel="$(basename "$f" .jsonc)"
            [[ "$channel" == channels ]] && continue
            echo "::group::Tests with $f"
            LOGIX_IDE_CHANNEL="$channel" scripts/test.sh
            echo "::endgroup::"
          done
