# Runs all code checks and tests (scripts/test.sh).

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at the start of the UTC day, to catch breakage from new
    # dependency or tool versions even when the code doesn't change.
    - cron: "0 0 * * *"

permissions:
  contents: read

# A newer run for the same branch or PR replaces an older one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The remote config (remote-config/logix-ide/<NNN>/: channels.jsonc and a
  # config file per channel): the shared check (schemas, channels, releases
  # and files exist, SHA256SUMS lists them, prod.jsonc names only stable
  # releases, only openlogix repos on main).
  remote-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check the remote config
        uses: openlogix/.github/actions/check-remote-config@main
        with:
          platforms: darwin-arm64

  # The channels the tests run on: one per config file in the newest version
  # folder (the website repo's CLAUDE.md, Remote updates, Channels): prod
  # alone in normal maintenance, dev too while dev.jsonc exists. Kept apart
  # from remote-config, so the tests neither wait for nor depend on its
  # network checks.
  channels:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.list.outputs.channels }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: List the channels
        id: list
        uses: openlogix/.github/actions/list-config-channels@main
        with:
          product: logix-ide

  test:
    name: test (${{ matrix.os }}, ${{ matrix.channel }})
    needs: channels
    # macOS on Apple Silicon: the only platform implemented so far, on each
    # macOS version GitHub offers (all arm64), named explicitly: add a new
    # one when GitHub ships it (macos-latest isn't listed: it's one of these,
    # so it tested the same image twice). Windows x64 (Milestone 3), named
    # explicitly too. Times each channel, so each config file's result shows
    # on its own and one failing doesn't stop the other. Add Linux with
    # Milestone 4.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2025]
        channel: ${{ fromJSON(needs.channels.outputs.channels) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # While Logix IDE is being ported to Windows (Milestone 3), a Windows
    # failure doesn't fail the run: its jobs show their results, but the
    # badge and repos-janitor stay on macOS's. Remove this once the Windows
    # tests pass.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    # Git's bash on Windows, as on macOS: the scripts are bash.
    defaults:
      run:
        shell: bash

    steps:
      # Files as in the repo, with LF line endings: Git on Windows converts
      # them to CRLF by default, which breaks the scripts and the tests that
      # compare files.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JS dependencies
        run: npm ci

      # For the end-to-end UI tests in scripts/test.sh.
      - name: Install the Playwright WebKit browser
        run: npx playwright install webkit

      # On the matrix's channel: what its config file names.
      - name: Run checks and tests
        env:
          LOGIX_IDE_CHANNEL: ${{ matrix.channel }}
        run: scripts/test.sh
