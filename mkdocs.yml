# The Logix IDE user documentation, published to GitHub Pages by
# .github/workflows/publish-docs.yaml. Pages are in docs/.
# "Docs" in the name: this is the docs, not the product's main page.
site_name: Logix IDE Docs
site_description: 'The Arduino experience, for FPGAs. A simple IDE for FPGAs, powered by Logix Engine.'
# Shown at the bottom of every page.
copyright: Logix IDE is not affiliated with or endorsed by Arduino. Arduino is a trademark of Arduino SA.
site_url: https://openlogix.github.io/logix-ide/
repo_url: https://github.com/openlogix/logix-ide
repo_name: openlogix/logix-ide
edit_uri: edit/main/docs/

# The generated site (not committed).
site_dir: _site

# Build tool requirements, not a page.
exclude_docs: |
  requirements.txt

theme:
  name: material
  # The Logix IDE icon from the Open Logix brand (openlogix.github.io docs/brand/ide.svg).
  logo: assets/logix-ide.svg
  favicon: assets/logix-ide.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.footer
    - content.code.copy
    # Platform tabs ("macOS", "Windows") switch together, on every page.
    - content.tabs.link

# The header logo links to the product page; the footer links back to it and the org.
extra:
  homepage: https://www.openlogix.org/ide/
  social:
    - icon: material/web
      link: https://www.openlogix.org/ide/
      name: Logix IDE website
    - icon: fontawesome/brands/github
      link: https://github.com/openlogix/logix-ide
      name: Logix IDE on GitHub

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Installing: installing.md
  - Tour: tour.md
  - Using Logix IDE: using-logix.md
  - Testbenches and simulation: testbenches.md
  - Troubleshooting: troubleshooting.md
