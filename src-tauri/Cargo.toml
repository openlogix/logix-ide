[package]
name = "logix"
version = "0.0.0"
description = "The Arduino experience, for FPGAs: a simple IDE for FPGAs, powered by Logix Engine"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "logix_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the pinned Logix Engine release from package.json (build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tauri-plugin-dialog = "2"
regex = "1"
tokio-util = "0.7"
# MCP client for Logix Engine (engine/), the same crate the engine uses.
rmcp = { version = "3.8", features = ["client", "transport-async-rw"] }
include_dir = "0.7"
toml_edit = "0.25.17"
trash = "5.2.9"

# macOS only: bringing GTKWave's window to the front (platform.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"

# Dependencies are built without debug info, which keeps the build folder
# much smaller. The project's own code keeps it, so crashes and debuggers
# still show its lines.
[profile.dev.package."*"]
debug = false
