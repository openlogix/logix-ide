[package]
name = "logix-ide"
version = "0.0.0"
description = "The Arduino experience, for FPGAs: a simple IDE for FPGAs, powered by Logix Engine"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "logix_ide_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
dirs = "6"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tauri-plugin-dialog = "2"
# The waveform viewer's PNG images come as base64.
base64 = "0.22"
regex = "1"
tokio-util = "0.7"
# MCP client for Logix Engine (engine/), the same crate the engine uses.
rmcp = { version = "3.8", features = ["client", "transport-async-rw"] }
toml_edit = "0.25.17"
trash = "5.2.9"
# Checking downloaded release files against their SHA256SUMS.
sha2 = "0.10"
hex = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# The clipboard on macOS (its pasteboard) and Linux (X11, and Wayland
# through XWayland): platform.rs.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false }

# Windows only (platform.rs): the clipboard.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[dev-dependencies]
tempfile = "3"

# Dependencies are built without debug info, which keeps the build folder
# much smaller. The project's own code keeps it, so crashes and debuggers
# still show its lines.
[profile.dev.package."*"]
debug = false
