<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>You and an AI agent working on one Logix IDE project</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-weight: 600; font-size: 14px; fill: #1f2328; }
    .text { fill: #33404a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #33404a; }
    .line { stroke: #5b6770; stroke-width: 1.6; fill: none; }
    .pill { fill: #ffffff; stroke: #c9d1d6; }
    .label { fill: #33404a; font-size: 12px; }
  </style>

  <!-- You -->
  <rect class="box" rx="10" x="300" y="12" width="160" height="44" fill="#fff4d6" stroke="#d9a400"/>
  <text class="title" x="380" y="39" text-anchor="middle">You</text>

  <!-- Logix IDE -->
  <rect class="box" rx="10" x="20" y="110" width="210" height="110" fill="#e3f4f4" stroke="#00878f"/>
  <text class="title" x="125" y="136" text-anchor="middle">Logix IDE</text>
  <text class="text" x="125" y="160" text-anchor="middle">see and edit the files,</text>
  <text class="text" x="125" y="178" text-anchor="middle">Run Tests, Simulate,</text>
  <text class="text" x="125" y="196" text-anchor="middle">Upload, Serial Monitor</text>

  <!-- AI agent -->
  <rect class="box" rx="10" x="530" y="110" width="210" height="110" fill="#efe9fb" stroke="#7c5cc4"/>
  <text class="title" x="635" y="136" text-anchor="middle">AI agent</text>
  <text class="text" x="635" y="160" text-anchor="middle">such as Claude Code:</text>
  <text class="text" x="635" y="178" text-anchor="middle">writes the design and its</text>
  <text class="text" x="635" y="196" text-anchor="middle">tests, runs them, fixes</text>

  <!-- Project folder -->
  <rect class="box" rx="10" x="275" y="100" width="210" height="140" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="title" x="380" y="126" text-anchor="middle">The project folder</text>
  <text class="mono" x="300" y="150">main.v</text>
  <text class="mono" x="300" y="168">main_tb.v</text>
  <text class="mono" x="300" y="186">pinout.pcf</text>
  <text class="mono" x="300" y="204">logix-ide.toml</text>
  <text class="mono" x="300" y="222">AGENTS.md</text>
  <text class="mono" x="388" y="150">uart.v</text>
  <text class="mono" x="388" y="168">main_tb.view</text>

  <!-- You to IDE and agent -->
  <path class="line" d="M300 42 C 200 50, 140 70, 125 106" marker-end="url(#arrow)"/>
  <path class="line" d="M460 42 C 560 50, 620 70, 635 106" marker-end="url(#arrow)"/>
  <rect class="pill" x="134" y="48" width="76" height="22" rx="11"/>
  <text class="label" x="172" y="63" text-anchor="middle">click, type</text>
  <rect class="pill" x="548" y="48" width="84" height="22" rx="11"/>
  <text class="label" x="590" y="63" text-anchor="middle">ask, review</text>

  <!-- IDE and agent to the folder -->
  <path class="line" d="M232 160 L 271 160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M489 160 L 526 160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="pill" x="196" y="244" width="120" height="38" rx="10"/>
  <text class="label" x="256" y="260" text-anchor="middle">saves by itself,</text>
  <text class="label" x="256" y="275" text-anchor="middle">shows changes</text>
  <rect class="pill" x="444" y="244" width="120" height="38" rx="10"/>
  <text class="label" x="504" y="260" text-anchor="middle">reads and</text>
  <text class="label" x="504" y="275" text-anchor="middle">edits files</text>
  <path class="line" d="M252 241 L 252 172" stroke-dasharray="3 3"/>
  <path class="line" d="M508 241 L 508 172" stroke-dasharray="3 3"/>

  <!-- Engines -->
  <rect class="box" rx="10" x="45" y="300" width="160" height="56" fill="#ece8f8" stroke="#6b4fbb"/>
  <text class="title" x="125" y="324" text-anchor="middle">Logix Engine</text>
  <text class="text" x="125" y="343" text-anchor="middle">Logix IDE's own</text>
  <rect class="box" rx="10" x="555" y="300" width="160" height="56" fill="#ece8f8" stroke="#6b4fbb"/>
  <text class="title" x="635" y="324" text-anchor="middle">Logix Engine</text>
  <text class="text" x="635" y="343" text-anchor="middle">the agent's own</text>
  <path class="line" d="M125 222 L 125 296" marker-end="url(#arrow)"/>
  <path class="line" d="M635 222 L 635 296" marker-end="url(#arrow)"/>

  <!-- Board -->
  <rect class="box" rx="10" x="290" y="400" width="180" height="56" fill="#e7f6ea" stroke="#2e8b47"/>
  <text class="title" x="380" y="424" text-anchor="middle">iCESugar v1.5</text>
  <text class="text" x="380" y="443" text-anchor="middle">over USB</text>
  <path class="line" d="M170 358 C 200 400, 240 420, 286 426" marker-end="url(#arrow)"/>
  <path class="line" d="M590 358 C 560 400, 520 420, 474 426" marker-end="url(#arrow)"/>
  <rect class="pill" x="300" y="366" width="160" height="22" rx="11"/>
  <text class="label" x="380" y="381" text-anchor="middle">one at a time</text>
</svg>
